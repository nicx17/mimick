sonar.projectKey=nicx17_mimick
sonar.organization=nicx17

sonar.sources=src
sonar.sourceEncoding=UTF-8

# Use the pre-generated Clippy report from CI instead of the embedded runner.
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=clippy-report.json

# Data tables of same-shaped rows, which token-based duplicate detection always flags.
sonar.cpd.exclusions=src/library/sidebar/rows.rs

# GTK CSS styles widget nodes (scale, trough, slider, progressbar, ...), which web CSS doesn't
# know, so "selectors should be known" flags every one.
sonar.issue.ignore.multicriteria=gtknodes
sonar.issue.ignore.multicriteria.gtknodes.ruleKey=css:S4670
sonar.issue.ignore.multicriteria.gtknodes.resourceKey=src/**/*.css
